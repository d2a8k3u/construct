name: Install failure
description: A plugin does not install or update from the construct marketplace.
labels: [bug]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - adaptive-cognitive-memory
        - slack-board
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command and output
      description: The `claude plugin marketplace add`, `install` or `update` command you ran and everything it printed.
      render: shell
    validations:
      required: true
